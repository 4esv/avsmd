name: release

on:
  push:
    tags: ["v*"]
  # A run by hand tests and builds the binaries and stops there: only a
  # tag releases and publishes.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    env:
      TARBALL: avsmd-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - if: runner.os == 'Linux'
        run: cross build --release --locked --target ${{ matrix.target }}
      # macos-latest is Apple silicon; Apple's toolchain builds x86_64 from it.
      - if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check both binaries are static
        if: runner.os == 'Linux'
        run: |
          for bin in avsmd avsm; do
            file target/${{ matrix.target }}/release/$bin | grep -E 'statically linked|static-pie linked'
          done
      - name: Check both binaries are for the target and link only the system
        if: runner.os == 'macOS'
        run: |
          case ${{ matrix.target }} in aarch64-*) arch=arm64 ;; *) arch=x86_64 ;; esac
          for bin in avsmd avsm; do
            f=target/${{ matrix.target }}/release/$bin
            lipo -archs "$f" | grep -qx "$arch"
            if otool -L "$f" | tail -n +2 | grep -v -e '^\s*/usr/lib/' -e '^\s*/System/'; then
              echo "$bin links outside the system"; exit 1
            fi
          done
      - name: Package the daemon, the client and the service files
        run: |
          cp -R contrib target/${{ matrix.target }}/release/contrib
          tar -C target/${{ matrix.target }}/release -czf "$TARBALL" avsmd avsm contrib
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARBALL }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          fail_on_unmatched_files: true

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish avsmd to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked --package avsmd
